# =====================================================================
# 📦 Build the Android app on GitHub (not on EAS's build servers)
#   Actions → "Build Android" → Run workflow → choose the profile.
#   Runs `eas build --local` on a GitHub Linux machine, so no EAS build
#   credits are used. The signing key and the environment variables
#   (Supabase, GOOGLE_SERVICES_JSON) still come from EAS, exactly as for a
#   normal EAS build, so the Play Store signing stays the same.
#   Needs one repository secret: EXPO_TOKEN (expo.dev → Access tokens).
#   production      → .aab for the Play Store
#   production-apk  → .apk to install on the staff phones directly; it is on
#                     the same "production" channel, so "App update" reaches it
#   preview         → .apk on the "preview" channel (App update does NOT reach it)
#   The .aab / .apk is attached to the run (Artifacts), kept 14 days.
# =====================================================================
name: Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (eas.json)'
        type: choice
        options:
          - production
          - production-apk
          - preview
          - development
        default: production

concurrency:
  group: build-android-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # A private repository gets the smaller GitHub machine (2 CPUs, 7 GB memory;
      # a public one 4 CPUs, 16 GB). Asking Gradle for 6 GB there made the
      # machine run out of memory and stop in the middle of the build, so:
      #   · Gradle gets 3.5 GB, uses 2 workers, and Kotlin compiles inside
      #     Gradle (no second big Java process)
      #   · only the two phone CPU types are built (no x86 emulator code):
      #     every Android phone is covered and the build is about twice as fast
      #   · 8 GB of extra swap on the disk as a safety net
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError" -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false
      ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
      ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy: in-process
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Add swap (more memory room)
        run: |
          sudo fallocate -l 8G /swap-build || sudo dd if=/dev/zero of=/swap-build bs=1M count=8192
          sudo chmod 600 /swap-build
          sudo mkswap /swap-build
          sudo swapon /swap-build
          free -h
          nproc

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install packages
        run: npm ci

      # 🔔 The Firebase file (push). Optional repository secret GOOGLE_SERVICES_JSON_BASE64
      #   = the google-services.json in base64. Without it, the EAS variable
      #   GOOGLE_SERVICES_JSON is used (it must be "Sensitive", not "Secret").
      - name: Firebase file (from the GitHub secret, if set)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
            echo "Using the GitHub secret GOOGLE_SERVICES_JSON_BASE64"
          else
            echo "No GitHub secret: the EAS variable GOOGLE_SERVICES_JSON is used"
          fi

      - name: Build (${{ inputs.profile }})
        run: |
          case "${{ inputs.profile }}" in
            production) EXT=aab ;;
            *) EXT=apk ;;
          esac
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          OUT="lead-management-${VERSION}-${CODE}-${{ inputs.profile }}.${EXT}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          npx eas-cli@latest build --local --non-interactive \
            --platform android --profile "${{ inputs.profile }}" --output "$OUT"

      # 🔔 Never hand out an app without push: Firebase must be inside the file
      - name: Check push (Firebase) is inside the app
        run: |
          python3 - "$OUT" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = [n for n in z.namelist() if n.endswith(('resources.arsc', 'resources.pb'))]
          data = b''.join(z.read(n) for n in names)
          key = 'google_app_id'
          if key.encode() in data or key.encode('utf-16-le') in data:
              print('✅ Firebase (google_app_id) is inside the app: push will work')
          else:
              print('::error::This build has no Firebase (google_app_id): push would not work. '
                    'Make the EAS variable GOOGLE_SERVICES_JSON "Sensitive", or add the GitHub secret '
                    'GOOGLE_SERVICES_JSON_BASE64, then build again.')
              sys.exit(1)
          PY

      - name: Keep the file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 14
          if-no-files-found: error
