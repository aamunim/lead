plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.calllog'
version = '1.0.0'

android {
  namespace "expo.modules.calllog"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Runs a short job when a call ends, even if the app is closed
  implementation "androidx.work:work-runtime-ktx:2.9.1"
}